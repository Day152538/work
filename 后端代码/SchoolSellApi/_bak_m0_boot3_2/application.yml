# ============================================================
# 校园二手交易平台 - 主配置
# 整改说明：
# 1. 新增 jwt.secret / jwt.expire-hours：JWT 签名密钥与有效期配置化
#    （原 JwtUtil 硬编码密钥 "common"，任何人可伪造任意用户的 token）
# 2. 上传大小由 2080MB 收紧到 10MB（业务层另有 5MB 单文件限制）
# 3. 数据库连接池显式配置（HikariCP 默认值），时区由 UTC 改为 GMT+8
# 4. 增加日志级别配置，生产环境可通过 application-prod.yml 覆盖
# ============================================================
mybatis:
  typeAliasesPackage: com.xuyan.fm.model
  mapperLocations: classpath:mapper/*.xml

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itsource_18?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 9321

# JWT 鉴权配置（新增）：生产环境请通过环境变量 JWT_SECRET 覆盖默认值
jwt:
  secret: f4c9a7e2-8d3b-4x92-b1f6-7a5e0c8d3f21-schoolsell-jwt-signing-key-2026
  expire-hours: 12

logging:
  level:
    root: info
    com.xuyan.fm: debug
  file:
    name: logs/schoolsell.log

# springdoc-openapi（Swagger UI 替代原 swagger 2.x）：访问 /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

