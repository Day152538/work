# ============================================================
# 校园二手交易平台 - 主配置
# 整改说明：
# 1. 新增 jwt.secret / jwt.expire-hours：JWT 签名密钥与有效期配置化
#    （原 JwtUtil 硬编码密钥 "common"，任何人可伪造任意用户的 token）
# 2. 上传大小由 2080MB 收紧到 10MB（业务层另有 5MB 单文件限制）
# 3. 数据库连接池显式配置（HikariCP 默认值），时区由 UTC 改为 GMT+8
# 4. 增加日志级别配置，生产环境可通过 application-prod.yml 覆盖
# ============================================================
mybatis:
  typeAliasesPackage: com.xuyan.fm.model
  mapperLocations: classpath:mapper/*.xml

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itsource_18?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  # ============================================================
  # Redis（验证码 / 登录限流 / 热点缓存）
  # 说明：
  # 1. 未安装 Redis 时应用仍可启动——CaptchaService/LoginRateLimiter 会自动降级为内存模式；
  #    安装 Redis（默认 localhost:6379 无密码）后自动切换为 Redis 模式，支持多实例部署。
  # 2. 生产环境请通过环境变量 REDIS_HOST / REDIS_PASSWORD 覆盖。
  # ============================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

  # ============================================================
  # Spring AI（AI 识图预填功能，2026-09 新增）
  # 说明：
  # 1. 走 OpenAI 兼容协议：spring-ai-starter-model-openai 只是协议实现，
  #    base-url 指向任何 OpenAI 兼容网关即可换厂商（DashScope / DeepSeek / 硅基流动……），
  #    换模型只改配置不改代码。
  # 2. API Key 安全（P0-1）：默认值一律是占位符 sk-no-key-configured，真实 Key 由
  #    环境变量 AI_API_KEY 注入（Windows 临时 set AI_API_KEY=sk-xxx；永久 setx；
  #    Linux/macOS export）。若此前 Key 曾写进仓库/文档，请视为已泄露并在模型控制台轮换。
  #    不配 Key 时 AI 接口返回友好提示，不影响商品手动发布。
  # 3. 默认走阿里云百炼 qwen-vl-plus 视觉模型（新用户有免费额度）；
  #    如需 DeepSeek 纯文本降级：base-url=https://api.deepseek.com/v1 且 model=deepseek-chat
  #    （注意 DeepSeek 不识别图片，仅无图场景可用）。
  # ============================================================
  ai:
    openai:
      # base-url 已含 /compatible-mode/v1，因此 completions-path 不能再用
      # 默认的 /v1/chat/completions，否则拼成 /v1/v1/chat/completions 导致 404/连接失败
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:sk-ws-H.EDYIDYH.o4lE.MEUCIDJqPKkuwfUhqzQZOb1tjEOt_Y7Sv8rXE5LeOD79PrinAiEA6bH3pxA0mKKGxIYS04strAGBEW5fDJhzuNskztppm1s}
      chat:
        completions-path: /chat/completions
        options:
          model: ${AI_MODEL:qwen-vl-plus}
          temperature: 0.3
          max-tokens: 800
    # P0-3：HTTP 层的失败重试交给框架自带的 RetryTemplate（spring.ai.retry.*）。
    # 只重试服务端 5xx，429/4xx 一律不重试（避免 429 双倍计费、400 无效重试）。
    # 结构化输出解析失败的那一次“重试”由业务层单独控制（AiPrefillServiceImpl）。
    retry:
      max-attempts: 2
      on-http-codes: 500,502,503,504
      on-client-errors: false
      exclude-on-http-codes: 429
      backoff:
        initial-interval: 500
        multiplier: 2
        max-interval: 4000

server:
  port: 9321

# AI 业务侧配置（本项目自有配置，非 Spring AI 标准项）
ai:
  # 每用户每分钟 AI 预填/合规调用上限（防 token 成本失控）
  rate-limit-per-minute: 10
  # 每用户每分钟 AI 对话调用上限（独立于预填，配额更宽松）
  chat-rate-limit-per-minute: 30
  # AI 对话使用的文本模型（识图预填仍用 qwen-vl-plus；聊天走文本模型，函数调用/多轮更稳）
  # qwen-max：联网搜索表现好（qwen-plus 联网时倾向保守返回"无法联网"）；费用高于 qwen-plus
  chat-model: ${AI_CHAT_MODEL:qwen-max}
  # 模型自动降级：主模型调用异常时，自动用降级模型重试一次（避免 qwen-max 偶发 5xx 导致用户体验中断）
  fallback-model: ${AI_FALLBACK_MODEL:qwen-plus}
  # M1 长期记忆：用户新增消息达到该条数后，增量摘要一次“用户画像”入库（越小越频繁、更耗 token）
  memory:
    summarize-after: 8
  # 对话助手“联网搜索”的兜底开关：默认关；前端聊天页有“联网”按钮，点击后按次开启
  # （DashScope/千问 enable_search=true，无需额外搜索 key）
  web-search:
    dashscope: false
    # 预留：将来若要接“第三方搜索服务（博查/Bing）”，在这里补实现即可
    enabled: false

# JWT 鉴权配置（新增）：生产环境请通过环境变量 JWT_SECRET 覆盖默认值
jwt:
  secret: f4c9a7e2-8d3b-4x92-b1f6-7a5e0c8d3f21-schoolsell-jwt-signing-key-2026
  expire-hours: 12

logging:
  level:
    root: info
    com.xuyan.fm: debug
  file:
    name: logs/schoolsell.log

# springdoc-openapi（Swagger UI 替代原 swagger 2.x）：访问 /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

